<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="कवितामित्र — a cartoon portrait of the poet Chaitrali">
  <defs>
    <clipPath id="face-clip"><ellipse cx="60" cy="52" rx="27" ry="31"/></clipPath>
  </defs>

  <circle cx="60" cy="60" r="59" fill="var(--agent-bg, #f6f1e7)"/>

  <!-- Shoulders and the saree's pink field -->
  <path d="M60 84c-20 0-36 11-40 30a60 60 0 0 0 80 0c-4-19-20-30-40-30Z" fill="var(--agent-pink, #e8499a)"/>
  <!-- Gold saree border running along the edge -->
  <path d="M60 84c-20 0-36 11-40 30 4 3 9 5 14 6 3-16 12-26 26-30Z" fill="var(--agent-gold, #d9a441)"/>
  <path d="M60 84c20 0 36 11 40 30-4 3-9 5-14 6-3-16-12-26-26-30Z" fill="var(--agent-gold, #d9a441)"/>
  <!-- Black pallu draped across, as in the photograph -->
  <path d="M26 114c4-19 20-30 40-30l-6 8c-14 2-25 10-28 22Z" fill="var(--agent-black, #241c26)"/>
  <path d="M94 114c-4-19-20-30-40-30l6 8c14 2 25 10 28 22Z" fill="var(--agent-pallu, #b3306f)"/>

  <!-- Neck -->
  <path d="M52 70h16v13a8 8 0 0 1-16 0Z" fill="var(--agent-skin, #f0c8a4)"/>
  <path d="M52 70h16v6a16 9 0 0 1-16 0Z" fill="#000" opacity="0.12"/>

  <!-- Hair, back layer: the shoulder-length wavy bob -->
  <path d="M31 60c-3-26 10-40 29-40s32 14 29 40c-1 9-3 16-6 21-1-12 0-20-2-27-5 6-13 9-24 8-8-1-14-4-18-9-2 7-2 16-3 27-3-5-4-12-5-20Z" fill="var(--agent-hair, #241c26)"/>
  <path d="M31 60c-3 14-2 26 2 34 3 6 7 8 10 7-5-9-6-22-4-33Z" fill="var(--agent-hair, #241c26)"/>
  <path d="M89 60c3 14 2 26-2 34-3 6-7 8-10 7 5-9 6-22 4-33Z" fill="var(--agent-hair, #241c26)"/>

  <!-- Face -->
  <ellipse cx="60" cy="52" rx="27" ry="31" fill="var(--agent-skin, #f0c8a4)"/>

  <g clip-path="url(#face-clip)">
    <!-- Side-parted fringe, sweeping across the brow -->
    <path d="M33 44c2-16 13-25 27-25s25 9 27 25c-4-11-13-17-22-15-8 2-14 7-17 15-4-1-9 0-15 0Z" fill="var(--agent-hair, #241c26)"/>
    <path d="M60 19c-8 0-15 3-19 9 8-3 19-4 30 1-3-6-7-10-11-10Z" fill="#fff" opacity="0.1"/>
  </g>

  <!-- Eyes, brows, nose, smile -->
  <g fill="var(--agent-ink, #2a1c22)">
    <ellipse cx="50" cy="53" rx="3.1" ry="3.6"/>
    <ellipse cx="70" cy="53" rx="3.1" ry="3.6"/>
  </g>
  <circle cx="51" cy="51.6" r="1.15" fill="#fff"/>
  <circle cx="71" cy="51.6" r="1.15" fill="#fff"/>
  <g fill="none" stroke="var(--agent-ink, #2a1c22)" stroke-width="1.7" stroke-linecap="round">
    <path d="M45 45.5c2-1.7 6-1.9 8.4-.6"/>
    <path d="M66.6 44.9c2.4-1.3 6.4-1.1 8.4.6"/>
  </g>
  <path d="M59 55.5c-.6 2-1 3.4-1 4.2 0 .8.7 1.3 1.8 1.4" fill="none" stroke="#c98f68" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M52.5 66c2.4 2.6 5.2 3.9 7.5 3.9s5.1-1.3 7.5-3.9" fill="none" stroke="#b33a52" stroke-width="2" stroke-linecap="round"/>
  <circle cx="45" cy="61" r="3.4" fill="#e8748c" opacity="0.28"/>
  <circle cx="75" cy="61" r="3.4" fill="#e8748c" opacity="0.28"/>

  <!-- Vermilion bindi -->
  <circle cx="60" cy="43" r="2.5" fill="var(--agent-accent, #b23a2a)"/>

  <!-- Gold jhumka earrings -->
  <g fill="var(--agent-gold, #d9a441)">
    <circle cx="33.5" cy="62" r="2.4"/>
    <path d="M31 66c2.5 3.5 2.5 6 0 8-2.5-2-2.5-4.5 0-8Z"/>
    <circle cx="86.5" cy="62" r="2.4"/>
    <path d="M84 66c2.5 3.5 2.5 6 0 8-2.5-2-2.5-4.5 0-8Z"/>
  </g>

  <!-- Mangalsutra -->
  <path d="M50 80c3 5 7 7 10 7s7-2 10-7" fill="none" stroke="var(--agent-gold, #d9a441)" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="60" cy="88" r="2.6" fill="var(--agent-gold, #d9a441)"/>
</svg>
